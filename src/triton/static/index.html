<title>Triton</title>
<script>
  // The CDT theme before the first paint, so a dark page never flashes light (cdt/sdk.js keeps it after).
  (function () {
    var t = "auto", b = "dar";
    try { t = localStorage.getItem("cdt.theme") || t; b = localStorage.getItem("cdt.brand") || b; } catch (e) {}
    if (t === "auto") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    document.documentElement.setAttribute("data-brand", b);
  })();
</script>
